; Hardening against PHP CVE-2026-109618 / CVE-2026-109619 ("PHP2Shell").
; The web image ships the fixed PHP 8.5.12 since the 7.0.32-alpine rebuild of
; 2026-10-22. The session upload progress feature, the attack path described
; in the advisory, is kept off as defense in depth: Zabbix does not use it.
session.upload_progress.enabled = 0
