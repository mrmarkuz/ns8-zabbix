; Mitigation for PHP CVE-2026-109618 / CVE-2026-109619 ("PHP2Shell").
; The PHP 8.5 package shipped in the zabbix-web-nginx-pgsql Alpine image is
; older than the fixed release 8.5.12. Disabling the session upload progress
; feature removes the attack path described in the advisory.
; This is a mitigation, not a fix: remove it once the image ships PHP >= 8.5.12.
session.upload_progress.enabled = 0
